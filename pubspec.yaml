name: geo_alarm
description: A location based alarm application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.7.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.4.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/geoalarm_alarm.wav